<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>polystrata-3d — 3D B-Rep Boolean kernel</title>
    <script>
      try {
        const t = localStorage.getItem("polystrata-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="/demo/style.css" />
  </head>
  <body class="lab">
    <div class="app">
      <header class="header">
        <a class="wordmark" href="/">polystrata <span>3D</span></a>

        <nav class="tabs desktop-only" role="tablist">
          <span class="tab active">Lab</span>
          <a href="/benchmark.html" class="tab">Benchmark</a>
        </nav>

        <div class="header-actions">
          <button id="btn-theme" class="icon-btn" aria-label="Toggle theme"></button>
          <a
            href="https://github.com/pboyer/polystrata-3d"
            target="_blank"
            rel="noopener noreferrer"
            class="icon-btn"
            aria-label="GitHub repository"
            title="GitHub"
          >
            <i data-lucide="github"></i>
          </a>
        </div>
      </header>

      <div class="layout">
        <!-- Left: scenarios & overlays (desktop) -->
        <aside class="sidebar left desktop-only">
          <div id="panel-3d" class="panel">
            <div class="section" style="padding-bottom: 0; border-bottom: none">
              <div class="section-head">
                <h2>Planar B-Rep scenarios</h2>
                <span id="badge-3d-count" class="hint">31</span>
              </div>
              <div id="filter-3d-categories" class="chip-row">
                <button data-cat="all" class="btn-chip active">All</button>
                <button data-cat="prisms" class="btn-chip">Prisms</button>
                <button data-cat="spheres" class="btn-chip">Spheres</button>
                <button data-cat="cylinders" class="btn-chip">Cylinders</button>
                <button data-cat="cones" class="btn-chip">Cones</button>
                <button data-cat="toroids" class="btn-chip">Toroids</button>
                <button data-cat="open" class="btn-chip">Open</button>
              </div>
            </div>
            <div id="example-3d-list" class="example-list"></div>

            <div class="section" style="border-top: 1px solid var(--line)">
              <div class="section-head">
                <h2>Overlays</h2>
              </div>
              <div class="control-group">
                <label class="checkbox-row">
                  <input id="chk-3d-inputs" type="checkbox" checked />
                  <span>Input wireframes</span>
                </label>
                <label class="checkbox-row">
                  <input id="chk-3d-shaded" type="checkbox" checked />
                  <span>Shaded faces</span>
                </label>
                <label class="checkbox-row">
                  <input id="chk-3d-edges" type="checkbox" checked />
                  <span>Face loops &amp; holes</span>
                </label>
                <label class="checkbox-row">
                  <input id="chk-3d-normals" type="checkbox" />
                  <span>Face normals</span>
                </label>
                <label class="checkbox-row">
                  <input id="chk-3d-color-face" type="checkbox" />
                  <span>Color by face</span>
                </label>
              </div>
            </div>
          </div>
        </aside>

        <!-- Center: 3D viewport -->
        <main class="stage">
          <div class="stage-head">
            <h1 id="active-scenario-title" class="scenario-title">Scenario</h1>
            <p id="scenario-description" class="scenario-footer"></p>
          </div>

          <div class="canvas-container">
            <canvas id="kernel-canvas"></canvas>

            <div class="overlay metrics">
              <span class="metric"><span id="metric-time" class="metric-value">0.00 ms</span></span>
              <span class="metric desktop-only">V/E <span id="metric-ve" class="metric-value">0 / 0</span></span>
              <span class="metric desktop-only">Faces <span id="metric-loops" class="metric-value">0</span></span>
              <span class="metric">Volume <span id="metric-area" class="metric-value">0.00</span></span>
            </div>

            <div class="overlay canvas-legend">
              <span class="legend-item"><i class="dot body-a"></i>A</span>
              <span class="legend-item"><i class="dot body-b"></i>B</span>
              <span class="legend-item"><i class="dot out-shell"></i>Edge</span>
              <span class="legend-item"><i class="dot out-hole"></i>Hole</span>
            </div>

            <div class="canvas-actions">
              <button id="btn-reset-geometry" class="icon-btn" title="Reset transform" aria-label="Reset transform">
                <i data-lucide="rotate-ccw"></i>
              </button>
              <button id="btn-fit-view" class="icon-btn" title="Reset camera" aria-label="Reset camera">
                <i data-lucide="maximize"></i>
              </button>
            </div>
          </div>
        </main>

        <!-- Right: transform, Boolean controls & audit (operation only on mobile) -->
        <aside class="sidebar right">
          <div class="section mobile-only">
            <div class="picker">
              <button id="btn-scenario-prev" class="icon-btn" aria-label="Previous scenario">
                <i data-lucide="chevron-left"></i>
              </button>
              <select id="scenario-select" class="picker-select" aria-label="Scenario"></select>
              <button id="btn-scenario-next" class="icon-btn" aria-label="Next scenario">
                <i data-lucide="chevron-right"></i>
              </button>
            </div>
          </div>

          <div class="section">
            <div class="section-head desktop-only">
              <h2>Operation</h2>
            </div>
            <div class="op-grid" id="op-selector">
              <button data-op="union" class="op-btn active">Union<span class="sym">A&cup;B</span></button>
              <button data-op="intersect" class="op-btn">Intersect<span class="sym">A&cap;B</span></button>
              <button data-op="difference" class="op-btn">Difference<span class="sym">A&minus;B</span></button>
              <button data-op="xor" class="op-btn">XOR<span class="sym">A&oplus;B</span></button>
              <button data-op="heal" class="op-btn">Heal</button>
            </div>
          </div>

          <div id="panel-3d-transform" class="section desktop-only">
            <div class="section-head">
              <h2>Transform B</h2>
              <button id="btn-3d-reset-transform" class="btn-inline">Reset</button>
            </div>
            <div class="control-group">
              <label class="control-label">
                <span>Translate x</span>
                <span id="val-3d-dx" class="mono-val">0.00</span>
              </label>
              <input id="slider-3d-dx" type="range" min="-6" max="6" step="0.05" value="0" />

              <label class="control-label">
                <span>Translate y</span>
                <span id="val-3d-dy" class="mono-val">0.00</span>
              </label>
              <input id="slider-3d-dy" type="range" min="-6" max="6" step="0.05" value="0" />

              <label class="control-label">
                <span>Translate z</span>
                <span id="val-3d-dz" class="mono-val">0.00</span>
              </label>
              <input id="slider-3d-dz" type="range" min="-6" max="6" step="0.05" value="0" />

              <label class="control-label">
                <span>Tilt &theta;<sub>x</sub></span>
                <span id="val-3d-rx" class="mono-val">0.00&deg;</span>
              </label>
              <input id="slider-3d-rx" type="range" min="-45" max="45" step="0.25" value="0" />

              <label class="control-label">
                <span>Tilt &theta;<sub>y</sub></span>
                <span id="val-3d-ry" class="mono-val">0.00&deg;</span>
              </label>
              <input id="slider-3d-ry" type="range" min="-45" max="45" step="0.25" value="0" />

              <label class="control-label">
                <span>Rotate &theta;<sub>z</sub></span>
                <span id="val-3d-rot" class="mono-val">0&deg;</span>
              </label>
              <input id="slider-3d-rot" type="range" min="-90" max="90" step="1" value="0" />

              <label class="control-label">Facet density</label>
              <div class="segmented-row" id="detail-3d-selector">
                <button data-scale="0.75" class="seg-btn">Coarse</button>
                <button data-scale="1" class="seg-btn active">Standard</button>
                <button data-scale="1.5" class="seg-btn">Fine</button>
              </div>
            </div>
          </div>

          <div class="section desktop-only">
            <div class="section-head">
              <h2>Winding rule</h2>
            </div>
            <div class="segmented-row" id="winding-selector">
              <button data-rule="positive" class="seg-btn active">Positive</button>
              <button data-rule="nonZero" class="seg-btn">Non-zero</button>
              <button data-rule="evenOdd" class="seg-btn">Even-odd</button>
            </div>
          </div>

          <div class="section desktop-only">
            <div class="section-head">
              <h2>Tolerance</h2>
            </div>
            <div class="control-group">
              <label class="control-label">
                <span>Snap r<sub>0</sub></span>
                <span id="val-snap-tol" class="mono-val">Auto</span>
              </label>
              <input id="slider-snap-tol" type="range" min="-9" max="0.5" step="0.05" value="-9" />
              <div class="chip-row">
                <button id="btn-tol-auto" class="btn-chip active">Auto</button>
                <button id="btn-tol-micro" class="btn-chip">10<sup>-4</sup></button>
                <button id="btn-tol-coarse" class="btn-chip">0.25</button>
              </div>
              <label class="checkbox-row">
                <input id="chk-simplify-collinear" type="checkbox" checked />
                <span>Simplify collinear vertices</span>
              </label>
            </div>
          </div>

          <div class="section desktop-only">
            <div class="section-head">
              <h2>Invariant audit</h2>
            </div>
            <div id="pipeline-diagnostics" class="diagnostics-box"></div>
          </div>
        </aside>
      </div>
    </div>

    <script type="module" src="/demo/main.ts"></script>
  </body>
</html>
