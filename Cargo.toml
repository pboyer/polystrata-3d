[package]
name = "polystrata-3d"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "High-performance 3D Planar B-Rep Boolean operations, coplanar face unification, and topological healing kernel"
homepage = "https://polystrata3d.ptrbyr.com"
repository = "https://github.com/pboyer/polystrata-3d"
documentation = "https://docs.rs/polystrata-3d"
readme = "README.md"
keywords = [
    "brep",
    "csg",
    "boolean-operations",
    "geometry",
    "cad",
]
categories = ["algorithms", "mathematics", "graphics", "science", "wasm"]
include = [
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
    "/crates/polystrata-3d-wasm/src/**/*",
]

[lib]
path = "crates/polystrata-3d-wasm/src/lib.rs"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
